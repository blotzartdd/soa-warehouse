name: CI

on:
  push:
  pull_request:

jobs:
  build-and-unit-tests:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [consumer, producer]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build ${{ matrix.service }}
        run: cargo build --manifest-path ${{ matrix.service }}/Cargo.toml

      - name: Unit tests – ${{ matrix.service }}
        run: cargo test --manifest-path ${{ matrix.service }}/Cargo.toml

  system-tests:
    name: Integration / E2E / Load / Metrics
    runs-on: ubuntu-latest
    needs: build-and-unit-tests
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # ── Python ──────────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test dependencies
        run: pip install -r tests/requirements.txt

      # ── k6 ──────────────────────────────────────────────────────────────────
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      # ── Docker environment ───────────────────────────────────────────────────
      - name: Build Docker images
        run: docker compose build

      - name: Start environment
        run: docker compose up -d

      - name: Wait for all services to be ready
        run: python tests/wait_for_services.py
        timeout-minutes: 12

      # ── Integration tests ────────────────────────────────────────────────────
      - name: Run integration tests
        run: pytest tests/integration/ -v --timeout=120

      # ── E2E tests ────────────────────────────────────────────────────────────
      - name: Run E2E tests
        run: pytest tests/e2e/ -v --timeout=180

      # ── Load tests ───────────────────────────────────────────────────────────
      - name: Run load tests (k6)
        run: |
          k6 run \
            --out json=tests/load/results.json \
            --env BASE_URL=http://localhost:8080 \
            tests/load/load_test.js

      # ── Metrics validation ───────────────────────────────────────────────────
      - name: Validate Prometheus metrics after load
        run: python tests/metrics/check_metrics.py

      # ── Consumer health under load ───────────────────────────────────────────
      - name: Check consumer health after load
        run: |
          STATUS=$(curl -sf http://localhost:9090/health | python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d['status']=='ok' else 1)" && echo ok || echo fail)
          echo "Consumer health: $STATUS"
          [ "$STATUS" = "ok" ]

      # ── Artefacts ────────────────────────────────────────────────────────────
      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: tests/load/results.json

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: /tmp/docker-logs/

      - name: Collect service logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/docker-logs
          docker compose logs --no-color > /tmp/docker-logs/all.log 2>&1 || true

      # ── Teardown ─────────────────────────────────────────────────────────────
      - name: Teardown
        if: always()
        run: docker compose down -v
